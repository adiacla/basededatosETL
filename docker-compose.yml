services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/0-create-airflow-db.sql:/docker-entrypoint-initdb.d/0-create-airflow-db.sql:ro
      - ./mysql/db_movies_neflix_transact.sql:/docker-entrypoint-initdb.d/1-db_movies.sql:ro
      - ./mysql/data_warehouse_netflix.sql:/docker-entrypoint-initdb.d/2-dw_netflix.sql:ro
      - ./mysql/data:/data

  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./mongodb/papeleria.js:/docker-entrypoint-initdb.d/papeleria.js:ro

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/airflow
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./mysql/data:/data
    command: >
      bash -c "airflow db init
      && (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      --lastname ${AIRFLOW_ADMIN_LASTNAME:-User} --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true)
      && (airflow scheduler &)
      && exec airflow webserver"

volumes:
  mysqldata:
  mongodata:
